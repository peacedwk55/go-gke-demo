# Trivy configuration.
#
# ─────────────────────────────────────────────────────────────────────────────
# IaC scanning MUST run against RENDERED manifests, not the source tree.
# ─────────────────────────────────────────────────────────────────────────────
#
# `trivy config .` reads k8s/overlays/prod/patches/*.yaml as if each file were a
# complete Deployment. They are Kustomize strategic-merge fragments — the
# securityContext lives in base/ — so Trivy reports HIGH "using the default
# security context" against manifests that are fully hardened once merged.
#
#   kustomize build k8s/overlays/prod > rendered/prod.yaml
#   trivy config rendered/ --config trivy.yaml
#
# Measured difference: 2 spurious HIGH findings against the source tree, versus
# 0 HIGH / 0 CRITICAL against the rendered output (41 of 42 policies passing).
#
# ─────────────────────────────────────────────────────────────────────────────
# `ignore-unfixed` is deliberate
# ─────────────────────────────────────────────────────────────────────────────
#
# A CVE with no upstream patch cannot be fixed here. Failing on it blocks every
# build indefinitely, and the inevitable response is to disable the gate
# entirely. Consciously accepted *fixable* findings go in .trivyignore with an
# owner and an expiry.

severity:
  - HIGH
  - CRITICAL

vulnerability:
  ignore-unfixed: true

scan:
  scanners:
    - vuln
    - misconfig

# NOTE on KSV-0125 ("untrusted registry"): there is no supported config-file key
# for extending Trivy's trusted-registry allowlist for that check — a
# `misconfiguration.trusted-registries` block is silently ignored, which was
# verified rather than assumed. The suppression therefore lives in .trivyignore,
# which is a mechanism that actually works, with the reasoning recorded there.
# Shipping config that looks like it handles something and does not is worse than
# shipping none.

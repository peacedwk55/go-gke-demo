# Tempo — distributed tracing.
#
# Chart version pinned in argocd/apps/observability.yaml (tempo-distributed 1.23.2).
#
# The distributed chart is used rather than the single-binary one for a specific
# reason: only tempo-distributed runs the metrics-generator, which derives the
# service graph and span metrics that make the Grafana service map and the
# trace -> metrics jump work. Those are a large part of what makes traces useful
# rather than merely present.

fullnameOverride: tempo

# ─────────────────────────────────────────────────────────────────────────────
# Ingestion
# ─────────────────────────────────────────────────────────────────────────────
distributor:
  replicas: 1

  config:
    log_received_spans:
      enabled: false # one log line per span would swamp Loki

  # NOTE: receivers are NOT configured here. See the top-level `traces:` block —
  # `distributor.receivers` is not a key this chart has, and Helm ignores unknown
  # values silently, so putting them here disables trace ingestion entirely
  # without any error. Proven by rendering: `otlp` appeared zero times.

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi

ingester:
  replicas: 1

  config:
    replication_factor: 1
    # How long a trace is held open before being flushed. Longer than the
    # slowest expected request, or spans arriving late are written as a separate
    # partial trace — which looks like a broken trace rather than a config
    # problem.
    trace_idle_period: 10s
    max_block_duration: 5m

  persistence:
    enabled: true
    storageClass: standard-rwo
    size: 20Gi

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 512Mi

querier:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi

queryFrontend:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 128Mi

compactor:
  replicas: 1
  config:
    compaction:
      block_retention: 168h # 7 days, matching Loki
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi

# ─────────────────────────────────────────────────────────────────────────────
# metrics-generator — the reason for choosing the distributed chart.
#
# Derives RED metrics and a service graph FROM the traces and remote-writes them
# into Prometheus. That is what populates Grafana's service map and the
# trace -> metrics link, and it means span-derived latency exists even for
# routes the application does not instrument by hand.
# ─────────────────────────────────────────────────────────────────────────────
metricsGenerator:
  enabled: true
  replicas: 1

  config:
    registry:
      external_labels:
        source: tempo
    storage:
      remote_write:
        - url: http://kube-prometheus-stack-prometheus.observability.svc:9090/api/v1/write
          send_exemplars: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi

# ─────────────────────────────────────────────────────────────────────────────
# Storage
# ─────────────────────────────────────────────────────────────────────────────
# ── Trace ingestion ────────────────────────────────────────────────────────
#
# This is the chart's own key for receivers, and the ONLY place they take effect.
# An earlier version of this file set them under `distributor.receivers`, which
# reads naturally and does nothing: the chart has no such key, Helm drops unknown
# values without complaint, and Tempo comes up with no receiver at all. The app
# then exports OTLP into nothing and the symptom — "no traces in Tempo" — points
# at the app or the network rather than at this file.
#
# OTLP only. Jaeger, Zipkin and OpenCensus stay off: the app speaks OTLP (see
# app/telemetry.go), and a receiver nobody uses is attack surface plus a port to
# explain. Enabling a protocol here makes the chart both add the receiver to
# Tempo's config and publish the port on the distributor Service — which is why
# the app's OTEL_EXPORTER_OTLP_ENDPOINT can name it.
traces:
  otlp:
    http:
      enabled: true # :4318 — what k8s/overlays/prod/config.env points at
    grpc:
      enabled: true # :4317 — kept for any future gRPC exporter

storage:
  trace:
    # Local filesystem backend. GCS is the production answer for the same
    # reasons as Loki — cheaper, survives the pod, retention decoupled from
    # disk. Kept local to avoid requiring a bucket and IAM binding for a demo.
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Sampling is 100% at the SDK (ParentBased(AlwaysSample) in app/telemetry.go).
# Correct at assignment volume; at real traffic this becomes a cost and cardinality
# problem, and the answer is tail-based sampling in a collector — keep every
# erroring and slow trace, sample the rest. Noted rather than implemented.
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
    ingestion:
      max_traces_per_user: 10000

# Tempo's own metrics.
metaMonitoring:
  serviceMonitor:
    enabled: true

# Bundled Grafana/Prometheus subcharts would collide with kube-prometheus-stack.
prometheusRule:
  enabled: false

global:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

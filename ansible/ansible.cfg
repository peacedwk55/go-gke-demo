[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
host_key_checking    = True
interpreter_python   = auto_silent
stdout_callback      = yaml
# Show which tasks actually changed something at the end of a run. This is how
# the idempotency requirement gets checked: a second run must report changed=0.
callbacks_enabled    = profile_tasks
retry_files_enabled  = False
forks                = 10
# Diff output on by default: for template tasks it shows exactly which lines
# changed, which is the difference between "something changed" and knowing what.
nocows               = True

[ssh_connection]
# Pipelining removes one SSH round-trip per task. Requires requiretty to be off
# in sudoers, which is the default on modern Ubuntu.
pipelining           = True
ssh_args             = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
# become_ask_pass is deliberately NOT set. Passwordless sudo or --ask-become-pass
# on the command line; a password in a config file is a credential in Git.

[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
host_key_checking    = True
interpreter_python   = auto_silent
# `stdout_callback = yaml` used to resolve to community.general.yaml, and that
# is a trap worth spelling out because the failure is total and looks like a bug
# in Ansible itself.
#
# The plugin subclasses AnsibleDumper. ansible-core changed that class, and the
# plugin then raises at IMPORT time — before the first task, with
#
#   [ERROR]: Unexpected Exception, this is probably a bug:
#            function() argument 'code' must be code, not str
#   TypeError, from community/general/plugins/callback/yaml.py line 54
#   Process completed with exit code 250
#
# 250 is Ansible's "unexpected exception", not a failed task (2) and not a
# parser error (4), so nothing in the playbook is implicated and the traceback
# is pure ansible-core internals. community.general removed the callback in
# 13.0.0, which is upstream saying the same thing: this is the wrong way to ask
# for YAML output now.
#
# The replacement needs no collection at all. ansible-core's own `default`
# callback takes the format as an option.
#
# Note the ini key. It is `callback_result_format`, NOT `result_format` — that
# is the name in the plugin's doc fragment, and an unknown key in ansible.cfg is
# ignored in silence, so guessing it wrong means JSON output and no error to
# explain why.
stdout_callback            = default
callback_result_format     = yaml

# Per-task timings at the end of a run, which is how you find the slow task
# rather than guessing. It is NOT how idempotency is checked — that is the
# PLAY RECAP's changed= counter, and .github/workflows/ansible.yaml parses it.
# An earlier version of this comment claimed otherwise.
#
# profile_tasks lives in ansible.posix; ansible-core ships only default, junit,
# minimal, oneline and tree. So this line is a second collection callback loaded
# at startup, with the same class of risk the yaml one just demonstrated.
callbacks_enabled          = profile_tasks
retry_files_enabled  = False
forks                = 10
# Diff output on by default: for template tasks it shows exactly which lines
# changed, which is the difference between "something changed" and knowing what.
nocows               = True

[ssh_connection]
# Pipelining removes one SSH round-trip per task. Requires requiretty to be off
# in sudoers, which is the default on modern Ubuntu.
pipelining           = True
ssh_args             = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
# become_ask_pass is deliberately NOT set. Passwordless sudo or --ask-become-pass
# on the command line; a password in a config file is a credential in Git.

---
common_reboot_if_required: false
common_reboot_timeout: 600
common_apt_cache_valid_time: 3600
common_timezone: Asia/Bangkok
common_base_packages:
  - ca-certificates
  - curl
  - gnupg
  # tzdata is not a nicety: the timezone task below fails outright without it on a
  # minimal image ("given timezone Asia/Bangkok is not available"). A role should
  # install what it depends on rather than assume the base image carries it.
  - tzdata

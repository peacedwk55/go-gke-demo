---
galaxy_info:
  author: santiphap
  role_name: nginx_container
  description: NGINX in Docker, serving a Jinja2-templated page from a read-only bind mount
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
# No meta dependency on the docker role, even though this role genuinely needs
# Docker present.
#
# site.yml already lists both in order, and declaring the dependency here as
# well makes Ansible run the whole docker role a SECOND time — once from the
# play's roles list, once as this dependency. Harmless, because the role is
# idempotent, but it doubles the output and the runtime for nothing, and it
# obscures which pass a given task belongs to when reading a failure.
#
# The relationship is expressed where a reader looks for ordering: site.yml.
dependencies: []

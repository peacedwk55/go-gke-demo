---
- name: Create the node_exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present

- name: Create the node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    # system: true puts the uid below 1000, keeping it out of the human user
    # range and out of login listings.
    system: true
    # shell + no home: this account exists to own a process, not to be logged
    # into. If the exporter is ever compromised there is no shell to land in and
    # no home directory to stage anything in.
    shell: /usr/sbin/nologin
    create_home: false
    home: /nonexistent
    state: present

- name: Check the installed version
  ansible.builtin.command: "{{ node_exporter_bin_dir }}/node_exporter --version"
  register: node_exporter_installed
  # A version query is a read, not a change. Without changed_when: false this
  # would report changed on every run and changed=0 would be unreachable.
  changed_when: false
  failed_when: false

# Download and verify are a SEPARATE task from unpacking, and that split is the
# whole point rather than a stylistic preference.
#
# This was originally one `unarchive` task carrying `checksum:`. That parameter
# does not exist on unarchive:
#
#   Unsupported parameters for (ansible.legacy.unarchive) module: checksum
#
# So the task failed on every run, and the supply-chain control this role
# advertises had never actually run once. `get_url` is the module that verifies
# checksums; unarchive only extracts. ansible-lint cannot catch this — an
# unsupported parameter is a runtime module contract, not syntax.
- name: Download node_exporter and verify its checksum
  ansible.builtin.get_url:
    url: >-
      {{ node_exporter_download_base }}/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    # THE supply-chain control. A pinned version without this still trusts
    # whatever the download server returns; with it, a compromised or MITM-ed
    # artefact fails the play instead of being installed and started as a system
    # service.
    checksum: "{{ node_exporter_checksum }}"
    mode: "0644"
    owner: root
    group: root
  when: node_exporter_version not in (node_exporter_installed.stdout | default(''))

- name: Unpack the verified archive
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
  when: node_exporter_version not in (node_exporter_installed.stdout | default(''))

- name: Install the binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: "{{ node_exporter_bin_dir }}/node_exporter"
    remote_src: true
    mode: "0755"
    owner: root
    group: root
  # Owned by root, not by node_exporter. The service account must not be able to
  # overwrite the binary it executes -- otherwise a compromise of the process
  # becomes persistence.
  when: node_exporter_version not in (node_exporter_installed.stdout | default(''))
  notify: Restart node_exporter

- name: Remove the unpacked archive directory
  ansible.builtin.file:
    path: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
    state: absent
  # Keeps /tmp clean, and means the `creates:` guard above re-triggers correctly
  # rather than depending on tmp cleanup policy.

- name: Template the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
    owner: root
    group: root
  notify:
    - Reload systemd
    - Restart node_exporter

- name: Ensure node_exporter is enabled and running
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

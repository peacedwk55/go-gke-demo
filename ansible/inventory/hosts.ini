# Inventory.
#
# No credentials here. Connection details that vary per operator (key paths,
# jump hosts) belong in ~/.ssh/config or an untracked hosts.local.ini —
# .gitignore excludes that filename for exactly this reason.

[webservers]
# Replace with real hosts. ansible_host keeps the inventory name stable even if
# the address changes.
web-01 ansible_host=10.0.0.11
web-02 ansible_host=10.0.0.12

[webservers:vars]
ansible_user = ubuntu
ansible_python_interpreter = /usr/bin/python3

# A local Multipass/Vagrant VM for testing the playbook without cloud cost:
#   multipass launch 22.04 --name ansible-test
#   multipass exec ansible-test -- bash -c 'mkdir -p ~/.ssh && echo "<your pubkey>" >> ~/.ssh/authorized_keys'
[local_test]
# ansible-test ansible_host=192.168.64.5 ansible_user=ubuntu

[all:vars]
ansible_ssh_common_args = -o StrictHostKeyChecking=accept-new

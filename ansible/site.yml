---
# Entry point.
#
#   ansible-playbook -i inventory/hosts.ini site.yml
#   ansible-playbook -i inventory/hosts.ini site.yml --check --diff   # dry run
#   ansible-playbook -i inventory/hosts.ini site.yml --tags docker    # one role
#
# Roles are ordered by dependency: packages before Docker, Docker before the
# container that needs it. node_exporter is independent and last.
- name: Configure web servers
  hosts: webservers
  become: true

  # Fail fast on an unsupported OS rather than part-way through with a confusing
  # apt error. Every role here assumes Debian-family package management.
  pre_tasks:
    - name: Assert a Debian-family target
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: >-
          These roles use apt and the Docker apt repository, so they only
          support Debian/Ubuntu. Detected: {{ ansible_facts['os_family'] }}.
        quiet: true
      tags: [always]

  roles:
    - role: common
      tags: [common]
    - role: docker
      tags: [docker]
    - role: nginx_container
      tags: [nginx]
    - role: node_exporter
      tags: [node_exporter]

  post_tasks:
    # A smoke test, not a comment claiming it works. uri against localhost
    # proves the container is actually serving, and that the templated HTML
    # reached it.
    - name: Verify NGINX serves the templated page
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nginx_container_host_port }}/"
        return_content: true
      register: nginx_check
      retries: 5
      delay: 3
      until: nginx_check.status is defined and nginx_check.status == 200
      changed_when: false
      tags: [nginx, verify]

    - name: Assert the page was rendered from the template
      ansible.builtin.assert:
        that:
          - inventory_hostname in nginx_check.content
        fail_msg: "NGINX responded, but the page is not the templated one (hostname missing)."
        quiet: true
      tags: [nginx, verify]

    - name: Verify node_exporter is exposing metrics
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
        return_content: false
      register: ne_check
      retries: 5
      delay: 3
      until: ne_check.status is defined and ne_check.status == 200
      changed_when: false
      tags: [node_exporter, verify]

# Workload Identity: the whole answer to "no service account keys".
#
# This annotation is the only link the workload needs. GKE sees it, and the pod
# obtains short-lived, automatically rotated GCP credentials from the metadata
# server. There is no JSON key to mount, to rotate, to leak or to commit --
# none is ever created.
#
# The other half of the binding lives in Terraform (infra/terraform/modules/iam):
#   roles/iam.workloadIdentityUser on
#   serviceAccount:PROJECT_ID.svc.id.goog[prod/go-sample-app]
#
# PROJECT_ID is substituted at bootstrap; see k8s/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-sample-app
  annotations:
    iam.gke.io/gcp-service-account: app-prod@PROJECT_ID.iam.gserviceaccount.com

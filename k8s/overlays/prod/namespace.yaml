apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    # Enforce the restricted Pod Security Standard. The workload already
    # satisfies it (non-root, no privilege escalation, all capabilities
    # dropped, seccomp RuntimeDefault), so this turns those settings from a
    # convention into an admission-time guarantee: a future manifest that
    # regresses any of them is rejected rather than quietly deployed.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

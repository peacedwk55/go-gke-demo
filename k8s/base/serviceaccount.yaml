apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-sample-app
  labels:
    app: go-sample-app
# The Workload Identity annotation is applied by the prod overlay, because the
# GSA e-mail embeds the GCP project id and therefore differs per environment.
# See k8s/overlays/prod/patches/serviceaccount-wi.yaml.
#
# automountServiceAccountToken is false: this workload never calls the
# Kubernetes API, so mounting a token would hand any RCE a cluster credential
# for nothing. It does NOT affect Workload Identity, which obtains GCP tokens
# from the GKE metadata server rather than from a projected SA token volume.
automountServiceAccountToken: false
